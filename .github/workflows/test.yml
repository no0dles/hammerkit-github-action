name: test
on:
  push:
    branches: [master]
  pull_request:
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version: [latest, 1.7.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./
        with:
          version: ${{ matrix.version }}
      - name: hammerkit is installed in the next step
        shell: bash
        run: |
          hammerkit --version
          if [ "${{ matrix.version }}" != "latest" ]; then
            hammerkit --version | grep -F "${{ matrix.version }}"
          fi
