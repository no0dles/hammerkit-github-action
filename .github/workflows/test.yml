name: test
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
jobs:
  # no setup-node: the binary must run without it
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        version: [next, latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - id: hammerkit
        uses: ./
        with:
          version: ${{ matrix.version }}
      - name: hammerkit is on PATH in the next step
        shell: bash
        run: |
          hammerkit --version
          hammerkit --version | grep -F "$VERSION"
          test "$CACHE_HIT" = false
        env:
          VERSION: ${{ steps.hammerkit.outputs.version }}
          CACHE_HIT: ${{ steps.hammerkit.outputs.cache-hit }}

  # a second run in the same job finds the binary in the tool cache, as every job on a
  # self-hosted runner after the first does
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: first
        uses: ./
        with:
          version: 2.0.0
      - id: second
        uses: ./
        with:
          version: 2.0.0
      - shell: bash
        run: |
          hammerkit --version | grep -F 2.0.0
          test "$FIRST" = false
          test "$SECOND" = true
          test -f "$RUNNER_TOOL_CACHE/hammerkit/2.0.0/x64.complete"
          test -x "$RUNNER_TOOL_CACHE/hammerkit/2.0.0/x64/hammerkit"
        env:
          FIRST: ${{ steps.first.outputs.cache-hit }}
          SECOND: ${{ steps.second.outputs.cache-hit }}

  # releases without binaries are installed with npm
  npm-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          version: 1.23.0
      - shell: bash
        run: hammerkit --version | grep -F 1.23.0

  rejects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: invalid
        uses: ./
        continue-on-error: true
        with:
          version: 'latest; echo injected'
      - id: unknown
        uses: ./
        continue-on-error: true
        with:
          version: no-such-tag
      - shell: bash
        run: |
          test "$INVALID" = failure
          test "$UNKNOWN" = failure
        env:
          INVALID: ${{ steps.invalid.outcome }}
          UNKNOWN: ${{ steps.unknown.outcome }}
